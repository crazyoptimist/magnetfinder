[package]
name = "magnetfinder"
version = "0.4.0"
authors = ["bleusakura", "crazyoptimist"]
edition = "2024"
license = "GPL-3.0"
homepage = "https://github.com/crazyoptimist/magnetfinder"
repository = "https://github.com/crazyoptimist/magnetfinder"
description = "CLI Application for Finding Torrent Magnets on the Internet"
keywords = ["cli", "torrent"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ureq = { version = "3.4.2", features = ["socks-proxy"] }
scraper = "0.27.0"
comfy-table = "8.0.0"
config = "0.15.25"
directories = "6.0.0"
clap = { version = "4.6.7", features = ["derive"] }
